- hosts: all
  become: true
  tasks:
    - name: Base packages
      apt:
        name: [openjdk-17-jre-headless, git, curl, gnupg, unattended-upgrades]
        update_cache: true

    - name: Disable SSH password login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart ssh

  handlers:
    - name: restart ssh
      service: { name: ssh, state: restarted }

- hosts: jenkins_master
  become: true
  tasks:
    - name: Keyrings directory
      file: { path: /etc/apt/keyrings, state: directory }

    - name: Add Jenkins signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        force: true

    - name: Add Jenkins repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      apt: { name: jenkins, update_cache: true }

    - name: Start Jenkins
      service: { name: jenkins, state: started, enabled: true }

- hosts: jenkins_agent
  become: true
  tasks:
    - name: Create jenkins user
      user: { name: jenkins, shell: /bin/bash, home: /home/jenkins }

    - name: Install Ansible for pipeline use
      apt: { name: ansible }
